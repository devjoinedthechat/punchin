name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      # The README carries a test count. A badge nobody checks is a number that drifts, and this
      # project's whole argument is that a published figure should be one somebody can reproduce.
      - name: the README's test count is the test count
        run: |
          claimed=$(grep -o 'badge/tests-[0-9]*' README.md | grep -o '[0-9]*')
          actual=$(uv run pytest -q --collect-only 2>/dev/null | grep -o '^[0-9]* tests collected' | grep -o '^[0-9]*')
          if [ "$claimed" != "$actual" ]; then
            echo "README says $claimed tests, the suite has $actual" >&2; exit 1
          fi
          echo "$actual tests, as advertised"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # No API key and no `claude` binary here: the model backend is exercised through a scripted
      # stand-in that speaks Claude Code's stream-json, so CI runs the whole path and spends nothing.
      - run: uv run --isolated -p ${{ matrix.python }} --with pytest --with-editable . pytest -q

  corpus:
    # Every scenario, end to end, with the scripted pair. `careful` must reach the expected outcome on
    # all ten and `careless` must miss; if a change makes them agree, the corpus has stopped measuring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run punchin record --agent careful --repeat 3 --out .punchin/ci -q
      - name: The numbers, on the run summary
        run: |
          {
            echo '```'
            uv run punchin metrics .punchin/ci/*.json -q
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The gate the tool exists to be. The committed baseline is what the careful agent achieves, so
      # any change that makes a call worse fails the build and names the scenario.
      - run: uv run punchin check .punchin/ci/*.json --baseline baseline.json -q

  adapter:
    # The documented contract, exercised by the example that documents it. If the protocol drifts, the
    # example stops working, and somebody else's agent would have stopped working too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run punchin record --agent command --repeat 3
             --agent-command "uv run python examples/rule_agent.py"
             --out .punchin/byo -q
      - run: uv run punchin check .punchin/byo/*.json --baseline baseline.json -q

  imports:
    # A transcript in the crudest shape anyone would hand over, graded against an outcome stated on the
    # command line. Every other test starts from a recording punchin made itself, so nothing else here
    # would notice if reading somebody else's archive broke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/import_smoke.py

  judging:
    # The two commands that pass judgement on a run, on the scripted pair, free and deterministic.
    # `triage` must see the careless agent's faults and must see nothing in the careful agent's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run punchin record --agent careless --out .punchin/bad -q
      - name: triage finds the faults and exits non-zero
        run: |
          if uv run punchin triage .punchin/bad/*.json -q; then
            echo "triage found nothing in a corpus full of faults" >&2; exit 1
          fi
      - run: uv run punchin record --agent careful --out .punchin/good -q
      - run: uv run punchin triage .punchin/good/*.json -q
