[project]
name = "punchin"
version = "0.1.0.dev0"
description = "Fork a recorded voice-agent call at the turn it went wrong and replay the rest with the same customer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "devjoinedthechat", email = "235875317+devjoinedthechat@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["voice-agents", "conversational-ai", "replay", "regression-testing", "simulation", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40",
    "mcp>=2.2.0,<3",
    "pydantic>=2.7",
]

[project.scripts]
punchin = "punchin.cli:main"

[project.urls]
Repository = "https://github.com/devjoinedthechat/punchin"

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.2",
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
markers = ["slow: needs a recogniser model on disk"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "TRY", "C4", "PT", "RET", "ARG"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "ARG005", "PT018", "PLC0415"]

[tool.mypy]
strict = true
packages = ["punchin"]

[[tool.mypy.overrides]]
# Only the optional audio path imports it, and it ships no stubs.
module = "faster_whisper.*"
ignore_missing_imports = true
